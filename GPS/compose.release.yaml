# Imagens carregadas do arquivo Docker entregue; configure TLS no proxy do servidor.
services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: balancesys
      POSTGRES_USER: balancesys
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure em release.env privado}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balancesys -d balancesys"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    image: localhost/balancesys-migrate:20261125-r2
    environment:
      DATABASE_URL: postgresql://balancesys:${POSTGRES_PASSWORD:?Configure em release.env privado}@db:5432/balancesys?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: localhost/balancesys-api:20261125-r2
    environment:
      DATABASE_URL: postgresql://balancesys:${POSTGRES_PASSWORD:?Configure em release.env privado}@db:5432/balancesys?schema=public
      PORT: 3000
      NODE_ENV: production
      TRUST_PROXY: 1
      APP_BASE_URL: ${APP_BASE_URL:?Configure a origem HTTPS em release.env privado}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
